<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Akash World</title>
  <meta name="description" content="Akash World — a living 3D open world with real-time day/night cycle, rain, procedural terrain and trees. Built with Three.js." />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="style.css" />

  <!-- Three.js import map -->
  <script type="importmap">
  {
    "imports": {
      "three": "https://cdn.jsdelivr.net/npm/three@0.150.1/build/three.module.js"
    }
  }
  </script>
</head>
<body>

  <!-- Loading overlay -->
  <div id="loading-overlay">
    <div class="loader-inner">
      <div class="loader-spinner"></div>
      <p class="loader-label">Building Akash World</p>
      <div class="loader-bar-track">
        <div id="load-bar"></div>
      </div>
      <span id="load-pct">0%</span>
    </div>
  </div>

  <!-- Canvas mount point -->
  <div id="Home3D"></div>

  <!-- Rain / lightning overlay -->
  <div id="rain-overlay"></div>

  <!-- UI overlay (title & hints) -->
  <div class="ui-overlay">
    <h1 class="hero-title">Akash World</h1>
    <p class="hero-sub">Drag to orbit &nbsp;·&nbsp; Scroll to zoom &nbsp;·&nbsp; <span class="hint-door">Click door to open</span> &nbsp;·&nbsp; <span class="hint-fly">Explore the world</span></p>
  </div>

  <!-- World HUD (top-left panel) -->
  <div id="world-hud">
    <div class="hud-clock">
      <span id="hud-sky-icon">☀️</span>
      <span id="world-time-display">08:00</span>
    </div>

    <div class="hud-section">
      <label class="hud-label">Time of Day</label>
      <input type="range" id="time-slider" min="0" max="24" step="0.05" value="8" />
    </div>

    <div class="hud-section">
      <div class="hud-presets">
        <button class="hud-btn preset-btn" data-time="6"  title="Dawn">🌅</button>
        <button class="hud-btn preset-btn" data-time="12" title="Noon">☀️</button>
        <button class="hud-btn preset-btn" data-time="19" title="Dusk">🌇</button>
        <button class="hud-btn preset-btn" data-time="23" title="Night">🌙</button>
      </div>
    </div>

    <div class="hud-section">
      <label class="hud-label">Speed</label>
      <input type="range" id="speed-slider" min="0" max="6" step="0.1" value="0" />
    </div>

    <div class="hud-section">
      <button class="hud-btn" id="btn-playpause" style="width:100%;font-size:0.8rem;">▶️ Play</button>
    </div>

    <div class="hud-section hud-weather-row">
      <button class="hud-btn weather-btn active" id="btn-clear">🌤️ Clear</button>
      <button class="hud-btn weather-btn" id="btn-rain">🌧️ Rain</button>
    </div>
  </div>

  <!-- Door proximity prompt -->
  <div id="door-prompt">
    <button id="btn-open-door">🚪 Open Door</button>
    <button id="btn-go-inside">🏠 Go Inside</button>
  </div>

  <!-- Badge -->
  <a class="badge" href="#" onclick="return false">
    <span>Akash World · Three.js</span>
  </a>

  <!-- Hover tooltip -->
  <div id="tooltip"></div>

  <!-- Toast notification -->
  <div id="toast"></div>

  <script type="module" src="main.js"></script>
</body>
</html>
